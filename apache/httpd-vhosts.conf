LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

ServerName localhost

<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html

    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Authorization ve oturum başlıklarını arka uç servisine (uygulama) aktar
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RequestHeader set Authorization "%{HTTP_AUTHORIZATION}e" env=HTTP_AUTHORIZATION

    # Web API yönlendirmesi (/api/* -> http://uygulama:8080/api/*)
    ProxyPreserveHost On
    ProxyRequests Off
    RewriteEngine On
    RewriteRule ^/api/(.*)$ http://uygulama:8080/api/$1 [P,L,QSA]
    ProxyPassReverse /api/ http://uygulama:8080/api/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>

